# Builds the Get ArkStore download page and commits it to the `deploy` branch, which holds
# nothing else. GitHub Pages serves that branch:
#   https://ark-devs.github.io/ArkStore/download/
# One-time setup: Settings > Pages > Source: Deploy from a branch > `deploy` / (root).
# Uses the same EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_KEY secrets as the releases.
name: Download page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      # Project pages live under /<repo>/.
      EXPO_BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --include=dev --no-audit --no-fund

      - name: Build
        run: npx expo export -p web --output-dir dist-web

      # The page lives at /download/; the site root and unknown paths send people there.
      - name: Lay out the site
        run: |
          base="$EXPO_BASE_URL"
          mkdir -p site/download
          cp -r dist-web/_expo dist-web/favicon.ico site/
          [ -d dist-web/assets ] && cp -r dist-web/assets site/
          cp dist-web/index.html site/download/index.html
          redirect() {
            printf '<!doctype html>\n<meta charset="utf-8">\n<title>Get ArkStore</title>\n<meta http-equiv="refresh" content="0; url=%s">\n<link rel="canonical" href="%s">\n<a href="%s">Get ArkStore</a>\n' "$1" "$1" "$1"
          }
          redirect ./download/ > site/index.html
          redirect "$base/download/" > site/404.html
          touch site/.nojekyll
          printf '# ArkStore download page (generated)\n\nThis branch holds only the built Get ArkStore page, served by GitHub Pages at\nhttps://ark-devs.github.io/ArkStore/download/\n\nDon'"'"'t edit it by hand: `.github/workflows/pages.yml` on `main` rebuilds it from\n`src/app/download.tsx` on every push to main.\n' > site/README.md

      - name: Commit to the deploy branch
        working-directory: site
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Get ArkStore download page (built from ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
