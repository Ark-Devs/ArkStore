# Builds ArkStore's Android APKs on GitHub's servers and publishes them as a release.
# Push a tag like v1.2.0 to release; run it by hand from the Actions tab to just build.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   EXPO_PUBLIC_SUPABASE_URL   https://<project>.supabase.co
#   EXPO_PUBLIC_SUPABASE_KEY   the Supabase publishable key
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in app.json (creates the tag)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
    steps:
      - name: Check Supabase settings
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_KEY" ]; then
            echo "::error::Add the EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_KEY secrets under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci --include=dev --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APKs (one per CPU type, plus universal)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          elif [[ "${{ inputs.publish }}" == "true" ]]; then tag="v$(node -p "require('./app.json').expo.version")"
          else tag=""; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Name the APKs
        run: |
          mkdir -p dist
          version="${{ steps.tag.outputs.tag }}"
          [[ -n "$version" ]] || version="build-${GITHUB_SHA::7}"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$apk" "dist/ArkStore-${version}-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: arkstore-apks
          path: dist/*.apk

      # Creates the release, or adds the APKs to it when the desktop workflow got there first
      # (uploading assets only; editing an existing release is refused to workflow tokens).
      - name: Publish the GitHub release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "ArkStore $TAG" --notes-file "release-notes/$TAG.md" --target "$GITHUB_SHA"
          fi
