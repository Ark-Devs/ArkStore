# Builds ArkStore's Android APKs on GitHub's servers and publishes them as a release.
# Push a tag like v1.2.0 to release; run it by hand from the Actions tab to just build.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   EXPO_PUBLIC_SUPABASE_URL   https://<project>.supabase.co
#   EXPO_PUBLIC_SUPABASE_KEY   the Supabase publishable key
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      NODE_ENV: production
    steps:
      - name: Check Supabase settings
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_KEY" ]; then
            echo "::error::Add the EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_KEY secrets under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APKs (one per CPU type, plus universal)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APKs
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || version="build-${GITHUB_SHA::7}"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$apk" "dist/ArkStore-${version}-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: arkstore-apks
          path: dist/*.apk

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ArkStore ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: dist/*.apk
          fail_on_unmatched_files: true
