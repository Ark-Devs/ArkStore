# Builds ArkStore for Windows, macOS and Linux on GitHub's servers and attaches the installers
# to the same release as the Android APKs. Push a tag like v1.2.0 to release; run it by hand
# from the Actions tab to just build.
#
# Needs the same two repository secrets as the Android release:
#   EXPO_PUBLIC_SUPABASE_URL   https://<project>.supabase.co
#   EXPO_PUBLIC_SUPABASE_KEY   the Supabase publishable key
# Optional, for signed builds (see README > Desktop):
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD   Windows code-signing certificate (.pfx, base64)
#   CSC_LINK / CSC_KEY_PASSWORD           macOS Developer ID certificate (.p12, base64)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarizing
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the version in app.json (creates the tag)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      # Public: the GitHub OAuth app's client ID, for the "Approve on GitHub" link in Studio.
      EXPO_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID || 'Ov23li33ek4PVfnoVtV0' }}
    steps:
      - name: Check Supabase settings
        shell: bash
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_KEY" ]; then
            echo "::error::Add the EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_KEY secrets under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund

      - name: Test
        if: runner.os == 'Linux'
        run: npm test

      - name: Build the web UI
        run: npm run desktop:web

      - name: Package
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # No certificate for this OS: build unsigned instead of failing (ad-hoc signed on
          # macOS, which Apple silicon needs to run the app at all).
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          fi
          unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          if [ -z "$CSC_LINK" ] || [ "$RUNNER_OS" = "Linux" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            if [ "$RUNNER_OS" = "macOS" ]; then extra="-c.mac.identity=-"; fi
          fi
          npx electron-builder ${{ matrix.target }} --publish never $extra

      # Microsoft Store: set the repository variables MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER
      # and MS_STORE_PUBLISHER_NAME from Partner Center > Product identity. The .appx is a build
      # artifact to upload in Partner Center, not a release file.
      - name: Microsoft Store package
        if: runner.os == 'Windows' && vars.MS_STORE_IDENTITY_NAME != ''
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          npx electron-builder --win appx --x64 --publish never
          -c.appx.identityName="${{ vars.MS_STORE_IDENTITY_NAME }}"
          -c.appx.publisher="${{ vars.MS_STORE_PUBLISHER }}"
          -c.appx.publisherDisplayName="${{ vars.MS_STORE_PUBLISHER_NAME }}"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && vars.MS_STORE_IDENTITY_NAME != ''
        with:
          name: arkstore-microsoft-store
          path: desktop/dist/*.appx

      - uses: actions/upload-artifact@v4
        with:
          name: arkstore-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v$(node -p "require('./app.json').expo.version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      # Same release as the Android workflow: whichever finishes first creates it, the other
      # uploads its files (editing an existing release is refused to workflow tokens).
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.msi dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.blockmap dist/latest*.yml)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "ArkStore $TAG" --notes-file "release-notes/$TAG.md" --target "$GITHUB_SHA"
          fi
