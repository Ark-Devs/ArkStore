[package]
name = "ark-sideload"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "ArkStore's iPhone installer: signs an app with the person's free Apple Account and installs it (from a computer over USB, or on the iPhone itself)."

[lib]
name = "ark_sideload"
# rlib for the desktop binary, staticlib for the iPhone app (modules/ark-sideload).
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "ark-sideload"
path = "src/main.rs"

[dependencies]
isideload = { version = "0.4.0", default-features = false, features = ["install", "tokio-mt", "fs-storage"] }
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "amfi", "installation_proxy", "house_arrest", "afc", "tcp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rootcause = "0.12.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[features]
# The C interface for the iPhone app; always on for iOS, this turns it on elsewhere to check it builds.
ffi = []

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
